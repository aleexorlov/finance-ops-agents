name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (no secrets)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install pinned dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  docker:
    name: Build and smoke-test the server image
    runs-on: ubuntu-latest
    env:
      TOKEN: ci-smoke-test-token
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t finance-ops-mcp .
      - name: Refuses to start without a token
        run: |
          if docker run --rm finance-ops-mcp; then
            echo "Server started without MCP_AUTH_TOKEN"; exit 1
          fi
      - name: Start
        run: |
          docker run -d --name mcp -p 8080:8080 -e MCP_AUTH_TOKEN="$TOKEN" finance-ops-mcp
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1
      - name: Runs as a non-root user
        run: test "$(docker exec mcp id -u)" = "10001"
      - name: Smoke test (health, 401 without token, real tool call)
        run: scripts/smoke_test.sh http://localhost:8080 "$TOKEN"
      - name: Tool call was written to the audit log
        run: docker logs mcp 2>&1 | grep '"tool": "get_overdue_invoices"'

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
