[[case]]
id = "usage-gap"
tag = "data-quality"
checks = "Reports missing days of usage instead of explaining a drop as lower usage"
question = "Juniper Retail's usage dropped in September. Why?"
expect_status = ["answered_with_data_warnings"]
any_of = [
  ["missing", "gap", "no usage", "not recorded", "incomplete", "partial", "no data", "no recorded", "never recorded", "unrecorded", "absent", "wasn't recorded", "weren't recorded", "outage"],
  ["2026-09-21", "21 sep", "sep 21", "sept 21", "sep. 21", "sept. 21", "september 21", "21-23", "21 to 23", "21, 22", "21st"],
]
none_of = ["not a data gap", "no data gap", "not a gap", "not missing", "not due to missing", "21 days"]
evidence = [
  { tool = "get_usage", args = { account_id = "ACC-1024", month = "2026-09" }, path = "status", value = "partial" },
  { tool = "get_usage", args = { account_id = "ACC-1024", month = "2026-09" }, path = "data.coverage.days_missing", value = "3" },
]

[[case]]
id = "stale-feed"
tag = "data-quality"
checks = "Gives a month-to-date figure only with the date the stale feed stops at"
question = "How much has Linden Media used so far this month?"
expect_status = ["answered_with_data_warnings"]
figures = ["168089"]
any_of = [
  ["1 October", "October 1", "2026-10-01", "1st October", "Oct 1", "1 Oct", "Oct. 1", "1st of October", "1st Oct", "first day of October", "first of October", "01/10/2026", "10/1/2026", "10/01/2026"],
  ["stale", "behind", "incomplete", "only through", "only up to", "only runs", "stops at", "not yet loaded", "not loaded", "delayed", "lag", "missing", "partial", "not complete", "out of date", "not up to date"],
  ["credit"],
]
# Found by reading run 2's answers: claiming usage on the missing days is higher is
# speculation the data does not support.
none_match = ['(true|actual|real)\s+(total|usage|figure)s?\s+(is|are|will be|would be)\s+higher', 'higher than (the )?recorded', '(should|will) rise']
evidence = [
  { tool = "get_usage", args = { account_id = "ACC-1002", month = "2026-10" }, path = "status", value = "stale" },
  { tool = "get_usage", args = { account_id = "ACC-1002", month = "2026-10" }, path = "data.credits_recorded", value = "168089" },
]

