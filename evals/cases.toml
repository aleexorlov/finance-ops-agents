# Known-answer evaluation cases for Agent A.
#
# Every expected figure has an `evidence` entry naming the tool call and field it
# comes from; tests/test_eval_cases.py checks each one against the generated data,
# so the answers here cannot drift from the data or be typed from memory.
#
# The phrase lists were reviewed adversarially before the first full run: correct
# answers in varied styles must pass, and plausible wrong answers must fail.
#
# expect_status        run outcomes that count as correct (finance_ops/agent/types.py)
# figures              every one must appear (rounding to fewer places is fine)
# any_figure           at least one must appear
# all_or_none_figures  stating some but not all of these means one option was chosen
# any_of               for each group, at least one phrase must appear (case-insensitive)
# none_of              none of these phrases may appear
# none_match           none of these regexes may match (case-insensitive)
# headline_no_figures  the first line of the answer must not state a figure
# required_tools       each must have been called
# failing_tools        these tools are forced to fail for the case
# max_turns            overrides the step cap
# tag                  groups cases when results are compared with docs/scope.md
#
# Known gaps of rule-based grading (left as limitations, not over-fitted):
# - a correct verdict with a wrongly stated cause can pass (misbilled-invoice);
# - an answer that cites the wrong month for context can pass (overage);
# - the step-cap case checks the loop's behaviour, not where the agent was heading.

[[case]]
id = "plan-lookup"
tag = "lookup"
checks = "Resolves a name to an ID and reports the plan and fee"
question = "What plan is Marlow Health on, and what is its monthly fee?"
expect_status = ["answered"]
figures = ["4000.00"]
any_of = [["Enterprise"], ["EUR", "€", "euro"]]
none_of = ["Growth", "Scale", "Starter", "GBP", "£", "per year", "a year", "per annum", "annually", "yearly"]
required_tools = ["find_accounts"]
evidence = [
  { tool = "get_account", args = { account_id = "ACC-1005" }, path = "data.current_plan.name", value = "Enterprise" },
  { tool = "get_account", args = { account_id = "ACC-1005" }, path = "data.current_plan.monthly_fee", value = "4000.00" },
]

[[case]]
id = "overage"
tag = "lookup"
checks = "Reports credits over the allowance and the overage charge"
question = "Is Saffron Studios over its allowance for September 2026? By how much, and what does that cost?"
expect_status = ["answered"]
figures = ["65969", "52.78"]
any_of = [["GBP", "£", "pound"]]
none_of = ["not over", "under its allowance", "under the allowance", "within its allowance", "within the allowance", "headroom", "no overage", "52.78%", "165,969 credits over"]
evidence = [
  { tool = "get_usage", args = { account_id = "ACC-1010", month = "2026-09" }, path = "data.credits_over_allowance", value = "65969" },
  { tool = "get_usage", args = { account_id = "ACC-1010", month = "2026-09" }, path = "data.overage_charge", value = "52.78" },
]

[[case]]
id = "invoice-jump"
tag = "investigation"
checks = "Explains an invoice increase: the plan upgrade, plus a billing error found by reconciling (the prompt says to reconcile the later invoice)"
question = "Why did Kestrel Robotics' September invoice go up so much compared with August?"
expect_status = ["answered"]
figures = ["1637.36"]
any_of = [
  ["Scale"],
  ["overbill", "over-bill", "overcharg", "over-charg", "billing error", "billed incorrectly", "not billed correctly", "billed in error", "does not match", "doesn't match", "mismatch", "misbill", "should have been", "should not have been"],
]
none_of = ["underbill", "under-bill", "undercharg", "i have corrected", "i've corrected", "i have issued", "i've issued", "downgrade", "back to growth", "from scale to growth"]
none_match = ['(overbill|over-bill|overcharg)\w*\s+(by\s+)?\D{0,5}1,?281']
required_tools = ["reconcile_invoice"]
evidence = [
  { tool = "compare_invoices", args = { earlier_invoice_id = "INV-202608-1007", later_invoice_id = "INV-202609-1007" }, path = "data.changes.total_change", value = "1281.05" },
  { tool = "reconcile_invoice", args = { invoice_id = "INV-202609-1007" }, path = "data.billed_minus_expected", value = "1637.36" },
]

[[case]]
id = "misbilled-invoice"
tag = "reconciliation"
checks = "Finds that an invoice does not match metered usage, and by how much"
question = "Was invoice INV-202609-1007 billed correctly?"
expect_status = ["answered"]
figures = ["1637.36"]
any_of = [["overbill", "over-bill", "overcharg", "over-charg", "too much", "billed incorrectly", "not billed correctly", "was not correct", "isn't correct", "is not correct", "is incorrect", "was incorrect", "does not match", "doesn't match", "mismatch", "misbill", "mis-bill", "discrepanc", "billed in error", "wrongly"]]
none_of = ["underbill", "under-bill", "undercharg", "was billed correctly", "is correct at", "no incorrect", "not overcharged", "not overbilled", "nothing was overcharged", "i have corrected", "i've corrected", "i have issued", "i've issued"]
none_match = ['(overbill|over-bill|overcharg)\w*\s+(by\s+)?\D{0,5}999', 'should have been\s+\D{0,5}1,?637']
required_tools = ["reconcile_invoice"]
evidence = [
  { tool = "reconcile_invoice", args = { invoice_id = "INV-202609-1007" }, path = "data.billed_minus_expected", value = "1637.36" },
  { tool = "reconcile_invoice", args = { invoice_id = "INV-202609-1007" }, path = "data.expected.total", value = "999.00" },
]

[[case]]
id = "invoice-matches"
tag = "reconciliation"
checks = "Confirms a correct invoice without inventing a problem"
question = "Does invoice INV-202608-1007 match the usage we metered?"
expect_status = ["answered"]
