[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ops-agents"
version = "0.1.0"
description = "Two agents (a hand-written Claude tool loop and an ElevenAgents voice agent) sharing one read-only MCP tool server over synthetic billing data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alexander Orlov" }]
# The MCP server needs only these. The model SDK lives in the "agent" extra,
# so the server image has no way to call a model and never holds an API key.
dependencies = [
    "mcp==2.3.0",
    # Pulled in by mcp. 48.0.1 is the last release with Intel macOS wheels.
    "cryptography==48.0.1",
]

[project.optional-dependencies]
agent = ["anthropic==1.11.0", "python-dotenv==1.2.4"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_ops.data" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
